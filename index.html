<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar - Smooth UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
    <div class="profile-wrap">
        <button class="profile-button" id="profileButton">
            <i class="fa-solid fa-user guest-icon"></i>
            <img id="profileImage" src="https://i.pravatar.cc/150?img=12" alt="Profile">
        </button>
        <span class="profile-tooltip" id="profileTooltip">ورود به حساب</span>
    </div>

    <div class="nav-area" id="navArea">
        <div class="hover-bubble" id="hoverBubble"></div>
        <div class="active-indicator" id="activeIndicator"></div>

        <div class="nav-group">
            <button class="nav-item active" data-page="home">
                <i class="fa-solid fa-house"></i>
                <span class="tooltip">خانه</span>
            </button>
            <button class="nav-item" data-page="about">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span class="tooltip">درباره ما</span>
            </button>
            <button class="nav-item" data-page="services">
                <i class="fa-solid fa-compass"></i>
                <span class="tooltip">خدمات</span>
            </button>
        </div>

        <div class="group-line"></div>

        <div class="nav-group middle">
            <button class="nav-item" data-page="portfolio">
                <i class="fa-solid fa-layer-group"></i>
                <span class="tooltip">پورتفولیو</span>
            </button>
            <button class="nav-item" data-page="blog">
                <i class="fa-regular fa-bookmark"></i>
                <span class="tooltip">بلاگ</span>
            </button>
            <button class="nav-item" data-page="gallery">
                <i class="fa-regular fa-bell"></i>
                <span class="tooltip">گالری</span>
            </button>
        </div>

        <div class="group-line"></div>

        <div class="nav-group bottom-group">
            <button class="nav-item" data-page="contact">
                <i class="fa-solid fa-sliders"></i>
                <span class="tooltip">تماس با ما</span>
            </button>
        </div>
    </div>
</aside>

<main class="content" id="content">
    <!-- صفحات بطور پویا لود می‌شوند -->
</main>

<footer class="footer">
    <p>© 2024 Mahdi Modern UI. تمامی حقوق محفوظ است.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
